name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the problem first, then your idea. Knowing the goal helps us find the simplest fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to work on this
