name: Content correction
description: A lesson, question, explanation or glossary entry is wrong or unclear
labels: [content]
body:
  - type: markdown
    attributes:
      value: |
        Mistakes in a logic app matter. Thank you for reporting one.
  - type: input
    id: where
    attributes:
      label: Where is it
      description: Lesson title and page, or the question text, or the glossary term
      placeholder: "Rules of Inference, Dilemmas and Resolution, question 4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text if you can, and say why it is wrong or confusing.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional, but welcome. A textbook or paper reference helps a lot.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Wrong answer
        - Wrong or misleading explanation
        - Unclear wording
        - Typo
        - Missing topic
