name: Release

# Pushing a tag such as v1.2.0 builds a signed APK and publishes it as a GitHub release.
# The app's update checker reads this release, so the tag must match package.json.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  android:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # baked into the app so its update checker looks at this repository
      LOGICA_GH_OWNER: ${{ github.repository_owner }}
      LOGICA_GH_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check version, changelog and tag agree
        run: node scripts/check-release.js "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The signing secrets are missing. Every release must be signed with the same key or Android will refuse to install it over the old version. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/logica-release.keystore"
          {
            echo "LOGICA_KEYSTORE_PATH=$RUNNER_TEMP/logica-release.keystore"
            echo "LOGICA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "LOGICA_KEY_ALIAS=$KEY_ALIAS"
            echo "LOGICA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/logica-${VERSION}.apk"
          md5sum "out/logica-${VERSION}.apk" | awk '{print $1}' > "out/logica-${VERSION}.apk.md5"
          node scripts/release-notes.js "$VERSION" > out/notes.md
          ls -lh out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "out/logica-${VERSION}.apk" \
            "out/logica-${VERSION}.apk.md5" \
            --title "Logica ${VERSION}" \
            --notes-file out/notes.md \
            --verify-tag \
            $FLAGS
